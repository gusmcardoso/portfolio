name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PRs: cancela execuções antigas. main: nunca interrompe um deploy em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─────────────────────────── 1. Validação ───────────────────────────
  validate:
    name: Validar HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: html-validate
        run: npx --yes html-validate@9 index.html credito/index.html

  # ──────────────────── 2. Build + teste do container ────────────────────
  build:
    name: Build e teste da imagem
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Build local para teste
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portfolio:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Teste de fumaça
        run: |
          docker run -d --name site -p 8080:8080 portfolio:test

          echo "Aguardando o container..."
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz && break
            sleep 1
          done

          # Obs.: respostas vão para variáveis antes do grep. Com pipefail, "curl | grep -q"
          # pode falhar por SIGPIPE quando o grep encerra antes do curl terminar.
          set -x
          body=$(curl -fsS http://localhost:8080/)
          grep -q "Gustavo Martins" <<< "$body"
          curl -fsS -o /dev/null http://localhost:8080/credito/
          curl -fsS -o /dev/null http://localhost:8080/assets/css/style.css
          curl -fsS -o /dev/null http://localhost:8080/assets/js/main.js

          # Cabeçalhos de segurança presentes e versão do Nginx oculta
          headers=$(curl -fsSI http://localhost:8080/)
          grep -qi "x-content-type-options: nosniff" <<< "$headers"
          grep -qi "content-security-policy:" <<< "$headers"
          if grep -qi "server: nginx/" <<< "$headers"; then
            echo "Versão do Nginx exposta no cabeçalho Server"; exit 1
          fi

          # 404 de verdade e arquivos ocultos bloqueados
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/nao-existe)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/.env)" = "404"

          # Redirecionamento relativo, sem expor a porta interna
          redirect=$(curl -sI http://localhost:8080/credito)
          grep -qiE "^location: /credito/" <<< "$redirect"

          # Health check do Docker
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' site)
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          test "$status" = "healthy"

      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs site || true

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emulação para gerar também a versão ARM (ex.: Oracle Cloud Free Tier / Ampere)
      - name: Configurar QEMU
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@v3

      - name: Publicar imagem (latest + commit, amd64 + arm64)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

  # ─────────────────────────── 3. Deploy ───────────────────────────
  # Só roda depois de configurar o servidor e ligar a variável DEPLOY_ENABLED=true
  # (Settings → Secrets and variables → Actions → Variables). Veja o README.
  deploy:
    name: Deploy em produção
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar arquivos e subir a nova versão
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes"

          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p ~/portfolio"
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            deploy/docker-compose.prod.yml deploy/Caddyfile \
            "$SSH_USER@$SSH_HOST:~/portfolio/"

          $SSH "$SSH_USER@$SSH_HOST" "cd ~/portfolio \
            && export IMAGE='$IMAGE' TAG='$GITHUB_SHA' \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d --remove-orphans \
            && docker image prune -f"

      - name: Verificar site no ar
        if: vars.SITE_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.SITE_URL }}/healthz" && exit 0
            sleep 2
          done
          echo "Site não respondeu após o deploy" && exit 1
