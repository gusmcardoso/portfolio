# Nginx do portfólio — roda sem root na porta 8080 (imagem nginx-unprivileged)
server {
    # Só IPv4 dentro do container: "listen [::]" quebra o Nginx em hosts com IPv6 desativado
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Redirecionamentos relativos: evita expor a porta interna (8080) atrás do proxy
    absolute_redirect off;

    # Compressão
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Cabeçalhos de segurança.
    # ATENÇÃO: um add_header dentro de um "location" anula todos estes; por isso o cache
    # usa a diretiva "expires" em vez de add_header.
    # O hash sha256 libera apenas o script inline do <head> do index.html. Se ele mudar,
    # recalcule (veja o README).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-tuKyZn/3ycw/MNMDii/kvSPrelo6SCsJSecqb1n2neg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://140-238-184-58.sslip.io; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Health check usado pelo Docker e pelo pipeline
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML sempre revalidado (o deploy aparece na hora)
    location ~* \.html$ {
        expires -1;
        try_files $uri =404;
    }

    # Arquivos estáticos (sem hash no nome, então cache curto)
    location ~* \.(?:css|js|svg|png|jpe?g|webp|avif|ico|woff2?)$ {
        expires 1h;
        access_log off;
        try_files $uri =404;
    }

    # Bloqueia arquivos ocultos (.git, .env etc.)
    location ~ /\. {
        return 404;
    }
}
